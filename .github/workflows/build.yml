name: Build Saturn for Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Saturn Standalone Binary
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -File .\build.ps1

    - name: Verify Executable Generated
      shell: powershell
      run: |
        if (-not (Test-Path "Saturn.exe")) {
            Write-Error "Saturn.exe was not generated."
            exit 1
        }
        $item = Get-Item "Saturn.exe"
        Write-Host "Successfully generated Saturn.exe ($([math]::Round($item.Length / 1KB, 2)) KB)"

    - name: Upload Saturn Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-Windows-x64
        path: Saturn.exe
        if-no-files-found: error
