name: Build Orbit for Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Orbit Standalone Binary
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -File .\build.ps1

    - name: Verify Executable Generated
      shell: powershell
      run: |
        if (-not (Test-Path "Orbit.exe")) {
            Write-Error "Orbit.exe was not generated."
            exit 1
        }
        $item = Get-Item "Orbit.exe"
        Write-Host "Successfully generated Orbit.exe ($([math]::Round($item.Length / 1KB, 2)) KB)"

    - name: Upload Orbit Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Orbit-Windows-x64
        path: Orbit.exe
        if-no-files-found: error
